version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: dellclips-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dellclips
      POSTGRES_PASSWORD: dellclips
      POSTGRES_DB: dellclips
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
