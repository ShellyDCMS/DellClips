name: DellClips CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=verbose

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          AUTH_SECRET: "ci-dummy-secret"
          GMAIL_USER: "ci-dummy@gmail.com"
          GMAIL_APP_PASSWORD: "ci-dummy-password"
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          CF_ACCOUNT_ID: "dummy-account-id"
          CF_STREAM_TOKEN: "dummy-stream-token"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          AUTH_URL: "http://localhost:3000"
      - run: npm start &
      - run: npx wait-on http://localhost:3000 --timeout 60000
      - run: npx cypress run --browser chrome
        env:
          AUTH_SECRET: "ci-dummy-secret"
          GMAIL_USER: "ci-dummy@gmail.com"
          GMAIL_APP_PASSWORD: "ci-dummy-password"
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          CF_ACCOUNT_ID: "dummy-account-id"
          CF_STREAM_TOKEN: "dummy-stream-token"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          AUTH_URL: "http://localhost:3000"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          AUTH_SECRET: "ci-dummy-secret"
          GMAIL_USER: "ci-dummy@gmail.com"
          GMAIL_APP_PASSWORD: "ci-dummy-password"
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          CF_ACCOUNT_ID: "dummy-account-id"
          CF_STREAM_TOKEN: "dummy-stream-token"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          AUTH_URL: "http://localhost:3000"
